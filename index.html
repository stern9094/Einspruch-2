*{

}

body{

  font-family:Arial,sans-serif;
  background:#f2f0e8;
  color:#222;
}

.app{
  max-width:430px;
  margin:auto;
  padding:16px 14px;
}

h1{
  text-align:center;
  margin:4px 0 16px;
  font-size:28px;
}

.settings{
  background:#fff;
  padding:15px;
  border-radius:14px;
  box-shadow:0 2px 9px #0002;
}

label{
  display:block;
  font-weight:bold;
  margin:10px 0 5px;
}

select,
button{
  width:100%;
  font-size:18px;
  padding:11px;
  border-radius:10px;
}

select{
  border:1px solid #aaa;
  background:#fff;
}

button{
  margin-top:14px;
  border:0;
  background:#222;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.game{
  display:none;
  text-align:center;
}

.phase{
  font-size:21px;
  font-weight:bold;
  margin-top:18px;
}

.timer{
  font-size:48px;
  font-weight:bold;
  margin:4px;
}

.hint{
  font-size:15px;
  margin:4px 0 14px;
}

.grid{
  width:min(92vw,330px);
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.tile{
  aspect-ratio:1;
  background:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:clamp(22px,7vw,34px);
  box-shadow:0 2px 6px #0002;
  overflow:hidden;
}

.animal{
  padding:3px;
}

.animal svg{
  width:94%;
  height:94%;
  display:block;
}

.solution{
  display:none;
}

.solution-title{
  font-size:22px;
  font-weight:bold;
  margin:18px 0 10px;
}

.secondary{
  background:#fff;
  color:#222;
  border:1px solid #888;
}
</style>

<div class="timer" id="timer"></div>

/* =========================================
   INHALTSPOOL
========================================= */

function pool(type){

  if(type==="numbers"){

    return numbers.map(x=>({
      v:x
    }));

  }


  if(type==="symbols"){

    return symbols.map(x=>({
      v:x
    }));

  }


  if(type==="animals"){

    return animals.map(x=>({
      v:x[1],
      label:x[0],
      animal:true
    }));

  }


  return [

    ...numbers.map(x=>({
      v:x
    })),

    ...symbols.map(x=>({
      v:x
    })),

    ...animals.map(x=>({
      v:x[1],
      label:x[0],
      animal:true
    }))

  ];

}


/* =========================================
   MISCHEN
========================================= */

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=[
      a[j],
      a[i]
    ];

  }

  return a;
}


/* =========================================
   RUNDE ERZEUGEN
========================================= */

function makeSequence(type,n){

  const p=pool(type);


  /* Jedes Element nur einmal */

  if(duplicatesSelect.value==="unique"){

    return shuffle(p).slice(0,n);

  }


  /* Doppelte möglich */

  const a=[];

  for(let i=0;i<n;i++){

    a.push(
      p[
        Math.floor(
          Math.random()*p.length
        )
      ]
    );

  }

  return a;
}


/* =========================================
   ELEMENTE ANZEIGEN
========================================= */

function draw(el,a){

  el.innerHTML="";

  a.forEach(x=>{

    const d=
      document.createElement("div");

    d.className=
      "tile"+
      (x.animal ? " animal" : "");


    if(x.animal){

      d.innerHTML=x.v;

    }else{

      d.textContent=x.v;

    }


    if(x.label){

      d.title=x.label;

    }


    el.appendChild(d);

  });

}


/* =========================================
   COUNTDOWN
========================================= */

function countdown(seconds,text,done){

  clearInterval(interval);

  let t=seconds;

  phase.textContent=text;

  timer.textContent=t;


  interval=setInterval(()=>{

    t--;

    timer.textContent=t;


    if(t<=0){

      clearInterval(interval);

      done();

    }

  },1000);

}


/* =========================================
   SPIEL STARTEN
========================================= */

function start(){

  const anzahl=
    Number(countSelect.value);


  sequence=
    makeSequence(
      typeSelect.value,
      anzahl
    );


  settings.style.display="none";

  game.style.display="block";

  solution.style.display="none";

  grid.style.visibility="visible";


  hint.textContent=
    "Merke dir Reihenfolge und Positionen.";


  draw(
    grid,
    sequence
  );


  countdown(
    Number(memorySelect.value),
    "Merken!",
    ()=>{

      grid.style.visibility="hidden";


      hint.textContent=
        "Die Vorlage ist ausgeblendet. Lege jetzt deine Lösung.";


      countdown(
        Number(solveSelect.value),
        "Zeit zum Legen!",
        ()=>{

          /*
             Das ursprüngliche Spielfeld
             bleibt verborgen.
          */

          grid.style.visibility="hidden";


          phase.textContent=
            "Zeit ist um!";


          timer.textContent="0";


          hint.textContent=
            "Hier ist die richtige Lösung.";


          draw(
            solutionGrid,
            sequence
          );


          solution.style.display="block";

        }
      );

    }
  );

}


/* =========================================
   ZURÜCK
========================================= */

function back(){

  clearInterval(interval);

  game.style.display="none";

  settings.style.display="block";

  grid.style.visibility="visible";

  solution.style.display="none";

}


/* =========================================
   BUTTONS
========================================= */

startButton.addEventListener(
  "click",
  start
);


backButton.addEventListener(
  "click",
  back
);
